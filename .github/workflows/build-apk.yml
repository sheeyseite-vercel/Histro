name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project scaffold
        run: |
          flutter create --platforms=android --org com.histo --project-name histo /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android ./android

      - name: Configure manifest (name, internet, link opening)
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="HISTO"|' "$MAN"
          if ! grep -q 'android.permission.INTERNET' "$MAN"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n    <application|' "$MAN"
          fi
          cat "$MAN"

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=HISTO_PROXY_URL="${{ vars.HISTO_PROXY_URL }}" \
            --dart-define=HISTO_APP_TOKEN="${{ secrets.HISTO_APP_TOKEN }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HISTO-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk HISTO.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HISTO.apk --title "HISTO (latest build)" --notes "Automatic build from main." --target "$GITHUB_SHA"
