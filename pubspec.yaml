name: histo
description: HISTO - a sourced, bilingual (English/Arabic) history atlas that reads articles live from open references.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  html: ^0.15.4
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
